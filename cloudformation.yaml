AWSTemplateFormatVersion: '2010-09-09'
Description: 'Skyhigh Client Proxy Monitoring Server'

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  
  ApiKey:
    Type: String
    Default: skyhighclientproxy
    NoEcho: true
  
  AllowedCIDR:
    Type: String
    Default: 0.0.0.0/0
  
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

Resources:
  MonitoringSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Skyhigh monitoring server
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCIDR
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCIDR

  MonitoringEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  MonitoringInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref MonitoringSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip
          pip3 install flask gunicorn
          
          mkdir -p /opt/monitoring
          cd /opt/monitoring
          
          cat > app.py << 'APPEOF'
          from flask import Flask, request, jsonify
          from datetime import datetime, timedelta
          import threading
          import json
          import time

          app = Flask(__name__)
          client_statuses = {}
          lock = threading.Lock()
          API_KEY = "${ApiKey}"
          CLEANUP_INTERVAL = 60  # Run cleanup every 60 seconds
          STATUS_RETENTION_MINUTES = 5  # Keep client status for 5 minutes
          
          HTML_TEMPLATE = """<!DOCTYPE html>
          <html>
          <head>
              <title>Skyhigh Monitoring</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: system-ui, -apple-system, sans-serif;
                      background: linear-gradient(135deg, #667eea, #764ba2);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container {
                      max-width: 1400px;
                      margin: 0 auto;
                  }
                  h1 {
                      color: #fff;
                      text-align: center;
                      margin: 20px 0;
                      font-size: 2em;
                  }
                  .search-box {
                      background: #fff;
                      border-radius: 12px;
                      padding: 20px;
                      margin-bottom: 20px;
                      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                  }
                  #search {
                      width: 100%;
                      padding: 12px 16px;
                      font-size: 16px;
                      border: 2px solid #e5e7eb;
                      border-radius: 8px;
                      outline: none;
                      transition: border-color 0.2s;
                  }
                  #search:focus {
                      border-color: #667eea;
                  }
                  .list-container {
                      background: #fff;
                      border-radius: 12px;
                      overflow-x: auto;
                      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                  }
                  table {
                      width: 100%;
                      min-width: 800px;
                      border-collapse: collapse;
                  }
                  thead {
                      background: #f9fafb;
                      border-bottom: 2px solid #e5e7eb;
                  }
                  th {
                      padding: 16px;
                      text-align: left;
                      font-weight: 600;
                      color: #374151;
                      font-size: 0.9em;
                      text-transform: uppercase;
                      letter-spacing: 0.5px;
                      white-space: nowrap;
                  }
                  tbody tr {
                      border-bottom: 1px solid #e5e7eb;
                      transition: background-color 0.2s;
                  }
                  tbody tr:hover {
                      background-color: #f9fafb;
                  }
                  tbody tr.hidden {
                      display: none;
                  }
                  tbody tr.stale {
                      opacity: 0.5;
                  }
                  td {
                      padding: 16px;
                      color: #1f2937;
                      white-space: nowrap;
                  }
                  .computer-name {
                      font-weight: 600;
                      font-size: 1em;
                  }
                  .status-badge {
                      display: inline-block;
                      padding: 6px 12px;
                      border-radius: 6px;
                      font-size: 0.85em;
                      font-weight: 600;
                      text-align: center;
                  }
                  .connected {
                      background: #d1fae5;
                      color: #065f46;
                  }
                  .disconnected {
                      background: #fee2e2;
                      color: #991b1b;
                  }
                  .stale-badge {
                      background: #fef3c7;
                      color: #92400e;
                  }
                  .no-results {
                      text-align: center;
                      padding: 40px;
                      color: #6b7280;
                      display: none;
                  }
                  .count {
                      color: #fff;
                      text-align: center;
                      margin-bottom: 10px;
                      font-size: 0.95em;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Skyhigh Monitoring Dashboard</h1>
                  <div class="count" id="count"></div>
                  <div class="search-box">
                      <input type="text" id="search" placeholder="Search by computer name..." />
                  </div>
                  <div class="list-container">
                      <table>
                          <thead id="table-header">
                              <tr></tr>
                          </thead>
                          <tbody id="client-list"></tbody>
                      </table>
                      <div class="no-results" id="no-results">No clients found matching your search.</div>
                  </div>
              </div>
              <script>
                  let clientData = __CLIENT_DATA__;
                  let clientEntries = Object.entries(clientData);

                  // Collect all unique field names across all clients
                  let allFields = new Set();
                  clientEntries.forEach(([name, data]) => {
                      Object.keys(data).forEach(key => allFields.add(key));
                  });

                  // Define field order priority (fields not in this list will appear after)
                  const fieldOrder = ['ComputerName', 'Connection Status', 'Status', 'Version Number',
                                     'Policy Revision', 'Policy Name', 'Policy Timestamp', 'EspMode',
                                     'Active Proxy', 'PA Status', 'PA Access', 'Timestamp', 'LastUpdated'];

                  // Sort fields: prioritized fields first, then alphabetically
                  let sortedFields = Array.from(allFields).sort((a, b) => {
                      const aIndex = fieldOrder.indexOf(a);
                      const bIndex = fieldOrder.indexOf(b);
                      if (aIndex !== -1 && bIndex !== -1) return aIndex - bIndex;
                      if (aIndex !== -1) return -1;
                      if (bIndex !== -1) return 1;
                      return a.localeCompare(b);
                  });

                  // Generate table header
                  const thead = document.getElementById('table-header').querySelector('tr');
                  thead.innerHTML = sortedFields.map(field => {
                      return '<th>' + field + '</th>';
                  }).join('');

                  function isStale(lastUpdated) {
                      if (!lastUpdated) return false;
                      const now = new Date();
                      const updated = new Date(lastUpdated);
                      const diffMinutes = (now - updated) / 1000 / 60;
                      return diffMinutes > 2;  // Mark as stale after 2 minutes
                  }

                  function renderClients(filter = '') {
                      const tbody = document.getElementById('client-list');
                      const noResults = document.getElementById('no-results');
                      const filterLower = filter.toLowerCase();

                      let visibleCount = 0;
                      tbody.innerHTML = clientEntries.map(([name, data]) => {
                          const matches = name.toLowerCase().includes(filterLower);
                          if (matches) visibleCount++;

                          const stale = isStale(data.LastUpdated);
                          const rowClass = (matches ? '' : 'hidden') + (stale ? ' stale' : '');

                          const cells = sortedFields.map(field => {
                              let value = field === 'ComputerName' ? name : (data[field] || 'N/A');

                              // Special formatting for Connection Status
                              if (field === 'Connection Status') {
                                  const badgeClass = stale ? 'stale-badge' :
                                                    (value === 'Connected' ? 'connected' : 'disconnected');
                                  return '<td><span class="status-badge ' + badgeClass + '">' + value + '</span></td>';
                              }

                              // Bold computer name
                              if (field === 'ComputerName') {
                                  return '<td class="computer-name">' + value + '</td>';
                              }

                              return '<td>' + value + '</td>';
                          }).join('');

                          return '<tr class="' + rowClass + '">' + cells + '</tr>';
                      }).join('');

                      noResults.style.display = visibleCount === 0 ? 'block' : 'none';
                      updateCount(visibleCount, clientEntries.length);
                  }

                  function updateCount(visible, total) {
                      const countEl = document.getElementById('count');
                      if (visible === total) {
                          countEl.textContent = total + ' client' + (total !== 1 ? 's' : '') + ' total';
                      } else {
                          countEl.textContent = 'Showing ' + visible + ' of ' + total + ' client' + (total !== 1 ? 's' : '');
                      }
                  }

                  document.getElementById('search').addEventListener('input', function(e) {
                      renderClients(e.target.value);
                  });

                  renderClients();
                  setTimeout(() => location.reload(), 30000);
              </script>
          </body>
          </html>"""

          def cleanup_old_clients():
              """Remove clients that haven't reported in STATUS_RETENTION_MINUTES"""
              while True:
                  time.sleep(CLEANUP_INTERVAL)
                  with lock:
                      now = datetime.now()
                      to_remove = []
                      for name, data in client_statuses.items():
                          last_updated_str = data.get('LastUpdated')
                          if last_updated_str:
                              try:
                                  last_updated = datetime.strptime(last_updated_str, '%Y-%m-%d %H:%M:%S')
                                  age_minutes = (now - last_updated).total_seconds() / 60
                                  if age_minutes > STATUS_RETENTION_MINUTES:
                                      to_remove.append(name)
                              except:
                                  pass

                      for name in to_remove:
                          del client_statuses[name]
                          print(f"Removed stale client: {name}")

          # Start cleanup thread
          cleanup_thread = threading.Thread(target=cleanup_old_clients, daemon=True)
          cleanup_thread.start()

          @app.route('/')
          def dashboard():
              with lock:
                  client_data_json = json.dumps(client_statuses)
                  html = HTML_TEMPLATE.replace('__CLIENT_DATA__', client_data_json)
                  return html
          
          def is_valid_value(value, field_name):
              """Check if a value is valid (not a placeholder or error state)"""
              if not value or value in ['Unknown', 'N/A', 'Not Installed', 'Log file not found', 'Error reading logs']:
                  return False
              # Reject old hardcoded values
              if field_name == 'Version Number' and value == '1.0.0':
                  return False
              if field_name == 'Policy Revision' and value == 'Latest':
                  return False
              return True

          @app.route('/api/status', methods=['POST'])
          def receive_status():
              auth = request.headers.get('Authorization', '')
              if not auth.startswith('Bearer ') or auth[7:] != API_KEY:
                  return jsonify({'error': 'Unauthorized'}), 401
              try:
                  data = request.json
                  name = data.get('ComputerName', 'Unknown')
                  data['LastUpdated'] = datetime.now().strftime('%Y-%m-%d %H:%M:%S')

                  with lock:
                      if name in client_statuses:
                          # Merge with existing data - preserve good values
                          existing = client_statuses[name]
                          for key, new_value in data.items():
                              # Always update LastUpdated and ComputerName
                              if key in ['LastUpdated', 'ComputerName', 'Timestamp']:
                                  existing[key] = new_value
                              # For other fields, only update if new value is valid
                              elif is_valid_value(new_value, key):
                                  existing[key] = new_value
                              # Keep existing value if new value is invalid and we have existing data
                              elif key not in existing:
                                  existing[key] = new_value
                      else:
                          # New client - store all data
                          client_statuses[name] = data

                  return jsonify({'status': 'success'}), 200
              except:
                  return jsonify({'error': 'Bad request'}), 400
          
          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=8000)
          APPEOF
          
          cat > /etc/systemd/system/monitoring.service << 'SVCEOF'
          [Unit]
          Description=Monitoring Server
          [Service]
          WorkingDirectory=/opt/monitoring
          ExecStart=/usr/bin/python3 -m gunicorn --workers 2 --bind 0.0.0.0:8000 app:app
          Restart=always
          [Install]
          WantedBy=multi-user.target
          SVCEOF
          
          # Generate self-signed SSL certificate
          mkdir -p /etc/ssl/private
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/ssl/private/nginx-selfsigned.key \
            -out /etc/ssl/certs/nginx-selfsigned.crt \
            -subj "/C=US/ST=State/L=City/O=Organization/CN=${MonitoringEIP}"

          amazon-linux-extras install -y nginx1
          cat > /etc/nginx/conf.d/monitoring.conf << 'NGXEOF'
          server {
              listen 443 ssl;
              ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
              ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers HIGH:!aNULL:!MD5;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGXEOF

          systemctl daemon-reload
          systemctl enable monitoring nginx
          systemctl start monitoring nginx

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref MonitoringInstance
      AllocationId: !GetAtt MonitoringEIP.AllocationId

Outputs:
  PublicIP:
    Value: !Ref MonitoringEIP

  DashboardURL:
    Value: !Sub 'https://${MonitoringEIP}'
    Description: 'HTTPS Dashboard URL (accept browser certificate warning for self-signed cert)'

  APIEndpoint:
    Value: !Sub 'https://${MonitoringEIP}/api/status'
    Description: 'HTTPS API Endpoint (clients need to skip certificate validation)'